[tools]
"node" = "lts"
"biome" = "latest"
"npm:serve" = "latest"

[tasks.dev]
description = "Start dev server with serve"
run = "serve --no-clipboard src/"

[tasks.fmt]
description = "Auto-format source files"
run = "biome check --write ."

[tasks.fmt-check]
description = "Check formatting only"
run = "biome ci ."

[tasks.lint]
description = "Lint source files"
run = "biome lint ."

[tasks.ci]
description = "Run all CI checks"
depends = ["fmt-check", "lint"]
